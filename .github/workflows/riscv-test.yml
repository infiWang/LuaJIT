name: RISC-V Testing

on:
  push:
    branches:
      - riscv
      - v2.1-riscv64

jobs:
  test-riscv:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # Test with two RISC-V CPU configurations:
        # - rv64: Generic RISC-V 64-bit (equivalent to RVA20U64 profile)
        # - rva23u64: RVA23U64 profile (Application Profile 23 for 64-bit unprivileged)
        cpu: [rv64, rva23u64]
    
    steps:
      - name: Checkout LuaJIT
        uses: actions/checkout@v4
      
      - name: Install RISC-V toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-linux-gnu \
            qemu-user-static \
            build-essential \
            make
      
      - name: Build LuaJIT for RISC-V
        run: |
          make -C src clean
          make -C src \
            HOST_CC="gcc" \
            CROSS=riscv64-linux-gnu- \
            TARGET_CFLAGS="-march=rv64gc" \
            TARGET_LDFLAGS="-static" \
            BUILDMODE=static
          # Note: Building with baseline rv64gc ISA for maximum compatibility.
          # CPU-specific features are tested via QEMU's -cpu flag at runtime.
      
      - name: Verify LuaJIT binary
        run: |
          file src/luajit
          qemu-riscv64-static -cpu ${{ matrix.cpu }} src/luajit -v
      
      - name: Clone LuaJIT-test-cleanup
        uses: actions/checkout@v4
        with:
          repository: LuaJIT/LuaJIT-test-cleanup
          path: test-suite
      
      - name: Run LuaJIT test suite with ${{ matrix.cpu }}
        run: |
          cd test-suite
          echo "Running tests with CPU: ${{ matrix.cpu }}"
          qemu-riscv64-static -cpu ${{ matrix.cpu }} ../src/luajit test/test.lua